# 与 app/ui/design_system.py 的 CSS 变量同源——避免首帧白闪与控件配色漂移
[theme]
base = "light"
primaryColor = "#a85442"
backgroundColor = "#fffaf2"
secondaryBackgroundColor = "#fffdf8"
textColor = "#543f35"

# 与 app/utils/images.py 的 MAX_UPLOAD_MB 同源（20MB）。应用层的文件大小
# 门禁发生在 Streamlit 把上传读进内存之后——默认 200MB 的服务器上限会让
# 20MB 检查形同虚设，超限文件先占满内存才被拒绝。
[server]
maxUploadSize = 20
