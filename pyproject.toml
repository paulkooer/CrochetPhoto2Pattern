[project.scripts]
crochet2pattern = "app.cli:main"
crochet2pattern-eval = "app.evaluation:main"
crochet2pattern-trials = "app.trials:main"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crochet-photo2pattern"
version = "0.2.0b1"
description = "AI-powered Amigurumi crochet pattern generator from photos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
]

dependencies = [
    # 上界 <2.0：Streamlit 大版本常有破坏性 API 变更，升 2.x 需人工验证
    "streamlit>=1.40.0,<2.0",
    "openai>=1.0.0",
    # 0.95.0 已含 messages.parse(output_format=...)（structured outputs），
    # 已在本地实测；低于此版本不可用。
    "anthropic>=0.95.0",
    "pydantic>=2.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    # 无 LLM 的本地视觉降级（haar 人脸检测）；缺失时自动退纯默认值路径。
    # 上界 <5：OpenCV 5.x 移除了 legacy CascadeClassifier API。
    "opencv-python-headless>=4.8,<5",
    # color_design / local_vision 直接 import numpy（此前靠 opencv 传递带入；
    # 显式声明，避免 opencv 一旦改可选时配色静默降级单色）。
    "numpy>=1.24",
    # pose 暂限制在 3.11–3.12；3.13+ 显式使用提供新解释器 wheel 的
    # NumPy 2.x，避免 CI 从源码构建不支持新 ABI 的 1.26。
    "numpy>=2.3; python_version >= '3.13'",
    # GHSA-7gcm-g887-7qv7 / CVE-2026-0994 修复线；Streamlit 接受 protobuf<8。
    # MediaPipe 1.x 已移除旧版 protobuf<5 约束，所有解释器统一使用安全版本。
    "protobuf>=6.33.5,<8",
]

[project.urls]
Homepage = "https://github.com/paulkooer/CrochetPhoto2Pattern"
Repository = "https://github.com/paulkooer/CrochetPhoto2Pattern"
Issues = "https://github.com/paulkooer/CrochetPhoto2Pattern/issues"
Documentation = "https://github.com/paulkooer/CrochetPhoto2Pattern/blob/main/docs/README.md"
Changelog = "https://github.com/paulkooer/CrochetPhoto2Pattern/blob/main/CHANGELOG_EN.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.4",
    "hypothesis>=6.100",
]
# PDF 图解导出（可选，S4）：中文用 Adobe CID 字体，无需额外字体文件
pdf = ["reportlab>=4.0"]
# 姿态关键点实测 span（可选，S1）：1.0.1 移除 protobuf 依赖，避免旧版
# protobuf<5 的高危 JSON 递归绕过；仍会带入 opencv-contrib，故保持可选。
# 当前只在 3.11–3.12 的本地与 Linux extras CI 验证。
pose = ["mediapipe>=1.0.1,<2; python_version < '3.13'"]

# app/prompts/*.txt 是包内数据（运行时由 image_parser 读取）。
# pyproject 模式下 setuptools 默认不打包 package data，缺了这一段，
# `pip install .`（非 -e）后会静默降级到内置的弱 fallback 提示词。
[tool.setuptools.package-data]
app = ["prompts/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::UserWarning",
    "error::DeprecationWarning:app\\..*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle、F pyflakes、I isort、B bugbear（常见隐患）
select = ["E", "F", "W", "I", "B"]
