[project.scripts]
crochet2pattern = "app.cli:main"
crochet2pattern-eval = "app.evaluation:main"
crochet2pattern-trials = "app.trials:main"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crochet-photo2pattern"
version = "0.2.0b1"
description = "AI-powered Amigurumi crochet pattern generator from photos"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
]

dependencies = [
    # 上界 <2.0：Streamlit 大版本常有破坏性 API 变更，升 2.x 需人工验证
    "streamlit>=1.40.0,<2.0",
    "openai>=1.0.0",
    # 0.95.0 已含 messages.parse(output_format=...)（structured outputs），
    # 已在本地实测；低于此版本不可用。
    "anthropic>=0.95.0",
    "pydantic>=2.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    # 无 LLM 的本地视觉降级（haar 人脸检测）；缺失时自动退纯默认值路径。
    # 上界 <5：OpenCV 5.x 移除了 legacy CascadeClassifier API。
    "opencv-python-headless>=4.8,<5",
    # color_design / local_vision 直接 import numpy（此前靠 opencv 传递带入；
    # 显式声明，避免 opencv 一旦改可选时配色静默降级单色）。
    "numpy>=1.24",
    # MediaPipe 0.10.21 仍要求 NumPy <2；3.13+ 不安装 pose，显式使用提供
    # 新解释器 wheel 的 NumPy 2.x，避免 CI 从源码构建不支持新 ABI 的 1.26。
    "numpy>=2.3; python_version >= '3.13'",
    # Protobuf 4 的 C 扩展在 3.13 已产生 tp_new 弃用告警，Python 3.14
    # 已不再允许；Streamlit 接受 protobuf<8，因此在 3.13+ 核心环境抬高下界。
    # pose extra 被限制在 3.11–3.12，仍可独立使用 MediaPipe 所需的 protobuf<5。
    "protobuf>=6.33.5,<8; python_version >= '3.13'",
]

[project.urls]
Homepage = "https://github.com/paulkooer/CrochetPhoto2Pattern"
Repository = "https://github.com/paulkooer/CrochetPhoto2Pattern"
Issues = "https://github.com/paulkooer/CrochetPhoto2Pattern/issues"
Documentation = "https://github.com/paulkooer/CrochetPhoto2Pattern/blob/main/docs/README.md"
Changelog = "https://github.com/paulkooer/CrochetPhoto2Pattern/blob/main/CHANGELOG_EN.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.4",
    "hypothesis>=6.100",
]
# PDF 图解导出（可选，S4）：中文用 Adobe CID 字体，无需额外字体文件
pdf = ["reportlab>=4.0"]
# 姿态关键点实测 span（可选，S1）：0.10.30 起 Python Image 改写为 ctypes，
# Linux 上已有构造/析构回归（google-ai-edge/mediapipe#6331 同代绑定问题，
# 本仓远程 extras 复现）；暂固定在最后一个旧绑定版本系列。mediapipe 还会
# 带入 opencv-contrib 与 protobuf<5，并且 0.10.21 只发布到 Python 3.12，
# 因此必须保持可选且显式限制解释器，避免污染 3.13/3.14 核心解析。
pose = ["mediapipe>=0.10.20,<0.10.30; python_version < '3.13'"]

# app/prompts/*.txt 是包内数据（运行时由 image_parser 读取）。
# pyproject 模式下 setuptools 默认不打包 package data，缺了这一段，
# `pip install .`（非 -e）后会静默降级到内置的弱 fallback 提示词。
[tool.setuptools.package-data]
app = ["prompts/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::UserWarning",
    "error::DeprecationWarning:app\\..*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle、F pyflakes、I isort、B bugbear（常见隐患）
select = ["E", "F", "W", "I", "B"]
