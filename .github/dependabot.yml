version: 2
updates:
  # uv 同步更新 pyproject.toml 与 uv.lock。
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
