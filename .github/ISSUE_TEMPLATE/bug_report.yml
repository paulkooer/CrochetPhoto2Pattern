name: Bug 报告 / Bug report
description: "报告可复现的软件缺陷 / Report a reproducible defect (security: use SECURITY.md)"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈 / Thank you. Remove API keys, private photos, share payloads, and personal data. Do not disclose security issues here.
  - type: input
    id: version
    attributes:
      label: 版本或提交 / Version or commit
      description: "例如 / Example: 0.2.0b1 or a git commit SHA"
      placeholder: 0.2.0b1
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: 入口 / Entry point
      options:
        - Streamlit 照片模式 / Photo
        - Streamlit 手动模式 / Manual
        - Streamlit 网格模式 / Grid
        - crochet2pattern CLI
        - evaluation / trials CLI
        - 安装、构建或 CI / Install, build, or CI
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      description: 操作系统、Python、安装方式、extras / OS, Python, install method, and enabled extras
      placeholder: macOS 15, Python 3.12, uv sync --locked
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤 / Minimal reproduction
      description: 使用无敏感数据的最小输入 / Use minimal non-sensitive input; attach redacted JSON or screenshots
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志 / Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Pre-submission checks
      options:
        - label: 我已搜索现有 Issue，并确认这不是安全漏洞。/ I searched existing issues and this is not a vulnerability.
          required: true
        - label: 我已移除密钥、私人图片、个人信息和未经授权的数据。/ I removed secrets, private images, personal data, and unauthorized material.
          required: true
