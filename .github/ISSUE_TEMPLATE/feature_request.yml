name: 功能建议 / Feature request
description: 提出有场景、边界和验证方式的改进 / Propose a scoped, verifiable improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 描述工作流和阻碍 / Describe the workflow and obstacle, not only an implementation name
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 包括输入、输出、失败方式和兼容性 / Include inputs, outputs, failures, and compatibility
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 需要的证据层级 / Required evidence level
      options:
        - 结构/代数自动化验证 / Structural automation
        - 授权真实照片评测 / Authorized-photo evaluation
        - 独立实体试钩验证 / Independent physical trials
        - 文档、工程或隐私改进 / Docs, engineering, or privacy
        - 尚不确定 / Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与参考资料 / Alternatives and references
      description: 请说明许可边界 / Link public sources and state data/pattern licensing boundaries
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认 / Boundary checks
      options:
        - label: 我理解单张照片不能可靠恢复背面、深度或绝对尺度。/ I understand one photo cannot reliably recover the back, depth, or absolute scale.
          required: true
        - label: 若涉及真实图片或试钩数据，我有权使用并遵守数据协议。/ I am authorized to use any proposed photo/trial data and will follow repository protocols.
          required: true
