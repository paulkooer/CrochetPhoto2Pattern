name: 功能建议
description: 提出有明确使用场景、边界和验证方式的改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述实际工作流和当前阻碍，不要只给出实现名词
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 包括输入、输出、失败方式和兼容性
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: 需要的证据层级
      options:
        - 结构/代数自动化验证
        - 授权真实照片评测
        - 独立实体试钩验证
        - 文档、工程或隐私改进
        - 尚不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与参考资料
      description: 可附公开来源；请说明数据或图解的许可边界
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 我理解单张照片不能可靠恢复背面、深度或绝对尺度。
          required: true
        - label: 若建议涉及真实图片或试钩数据，我有权使用并会遵守仓库数据协议。
          required: true
