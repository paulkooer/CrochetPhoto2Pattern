name: dependency-security

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main, master]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/security.yml
  # 对所有 PR 运行：依赖漏洞门禁不能只在改动锁文件的 PR 上触发，
  # 否则一个绿色 PR 会被误读为“依赖已审计”。审计本身很快（固定清单，--no-deps）。
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      # setup-uv 同时负责 UV_PYTHON 解释器安装与 uv 自身缓存
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Export locked dependency set
        # 把 uv.lock 的完整解析结果（含 dev/pdf/pose 全部 extra、所有平台 marker）
        # 导出为固定版本清单，直接审计锁文件声明的依赖，而不是审计某个运行环境。
        run: >-
          uv export --locked --all-extras --no-hashes --no-emit-project
          --format requirements.txt -o audit-requirements.txt

      - name: Assert audit coverage
        # 防回归守卫（见历史事故）：曾经在 `uv run --with` 叠加环境下用
        # pip-audit 的 `--local` 标志只审计叠加层，审计 0 个包却报“无已知漏洞”。
        # 这里强制要求导出清单至少包含一个固定包，否则直接失败。
        run: |
          pkgs=$(grep -cE '^[^#[:space:]-].*==' audit-requirements.txt)
          echo "locked packages to audit: $pkgs"
          if [ "$pkgs" -eq 0 ]; then
            echo "::error::依赖审计覆盖为空——导出的锁定清单没有任何固定包"
            exit 1
          fi

      - name: Audit locked dependencies
        # --no-deps：清单已是完整解析结果，不再联网解析，只审计其中的固定版本；
        # 工具版本固定且通过临时 overlay 安装，不改 pyproject/uv.lock。
        # 发现已知漏洞时 pip-audit 返回非零，任务失败。
        run: >-
          uv run --with pip-audit==2.10.1
          pip-audit --requirement audit-requirements.txt --no-deps --progress-spinner off
