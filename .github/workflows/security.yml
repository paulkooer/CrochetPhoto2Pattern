name: dependency-security

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main, master]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/security.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/security.yml

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.8

      - name: Sync locked core environment
        run: uv sync --locked --extra dev

      - name: Audit installed dependencies
        # pip-audit 不直接读取 uv.lock；先按锁文件同步，再审计实际环境。
        # 审计工具固定版本且通过临时 overlay 安装，不改 pyproject/uv.lock。
        run: >-
          uv run --locked --extra dev --with pip-audit==2.10.1
          pip-audit --local --progress-spinner off
