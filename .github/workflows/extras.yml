name: extras

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: extras-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/change-scope.yml

  optional-extras:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.11"
    strategy:
      fail-fast: false
      matrix:
        extra: ["pdf", "pose"]
    steps:
      - uses: actions/checkout@v7
      - name: Check scope decision
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_FULL: ${{ needs.changes.outputs.run_full }}
        run: python3 scripts/ci_scope.py --guard

      # setup-uv 同时负责 UV_PYTHON 解释器安装与 uv 自身缓存
      - name: Install uv
        if: needs.changes.outputs.run_full == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install pose native runtime
        if: needs.changes.outputs.run_full == 'true' && (matrix.extra == 'pose')
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2

      # 可选依赖安装进同一环境：验证 [pose] 带入 opencv-contrib 后，
      # 应用仍可运行或安全降级（pose.py/subject.py 的防御路径）。
      - name: Sync locked dependencies with extra
        if: needs.changes.outputs.run_full == 'true'
        run: uv sync --locked --extra dev --extra "${{ matrix.extra }}"

      - name: Test
        if: needs.changes.outputs.run_full == 'true'
        run: uv run --locked --extra dev --extra "${{ matrix.extra }}" pytest -q

  pose-unlocked:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Check scope decision
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_FULL: ${{ needs.changes.outputs.run_full }}
        run: python3 scripts/ci_scope.py --guard
      - uses: astral-sh/setup-uv@v7
        if: needs.changes.outputs.run_full == 'true'
        with:
          python-version: "${{ matrix.python }}"
          enable-cache: true

      - name: Install pose native runtime
        if: needs.changes.outputs.run_full == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libglib2.0-0

      # Install from project metadata, not uv.lock. The previous declaration
      # allowed MediaPipe's contrib dependency to resolve to OpenCV 5.x.
      - name: Install unlocked pose extra
        if: needs.changes.outputs.run_full == 'true'
        run: |
          uv venv --python "${{ matrix.python }}"
          uv pip install -e '.[pose]' 'pytest>=7.0' 'packaging>=24.0'
          uv pip check

      - name: Exercise OpenCV and MediaPipe
        if: needs.changes.outputs.run_full == 'true'
        run: |
          .venv/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import cv2
          import mediapipe as mp
          import numpy as np
          from packaging.version import Version

          for name in ("opencv-contrib-python", "opencv-python-headless"):
              assert Version(version(name)).major == 4, (name, version(name))
          assert Version(cv2.__version__).major == 4, cv2.__version__
          cascade = Path(cv2.data.haarcascades) / "haarcascade_frontalface_default.xml"
          assert not cv2.CascadeClassifier(str(cascade)).empty()
          image = mp.Image(image_format=mp.ImageFormat.SRGB,
                           data=np.zeros((8, 12, 3), dtype=np.uint8))
          assert (image.width, image.height) == (12, 8)
          assert mp.tasks.vision.PoseLandmarker
          PY
          .venv/bin/python -m pytest -q tests/test_pose_dependency_resolution.py \
            tests/test_pose_spans.py tests/test_local_vision.py tests/test_subject_observation.py

  full-validation:
    name: full-validation (extras)
    needs: [changes, optional-extras, pose-unlocked]
    if: ${{ !cancelled() && needs.changes.outputs.run_full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attest that every full job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Full validation did not pass: {failed}")
          print("Every runtime job completed successfully")
          PY
