name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Test
        # 阈值放在 CI 命令而非 pytest addopts，保证本地裸 pytest 不依赖 pytest-cov
        # 当前实测 ~90%，阈值 80% 留出波动余量
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Build wheel (packaging check)
        run: |
          pip wheel . --no-deps -w dist/
          python - <<'EOF'
          import zipfile, glob, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          prompts = [n for n in names if n.startswith("app/prompts/") and n.endswith(".txt")]
          assert prompts, f"wheel missing prompt data files: {names}"
          print("prompt files in wheel:", prompts)
          EOF
