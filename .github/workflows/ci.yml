name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # .python-version 只服务本地默认值；远程矩阵必须显式覆盖，否则 uv 会让
    # 四个 job 都静默使用 3.12，形成“假矩阵”。
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.8

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --extra dev ruff check app tests

      - name: Test
        # 阈值放在 CI 命令而非 pytest addopts，保证本地裸 pytest 不依赖 pytest-cov
        # 当前实测 ~90%，阈值 80% 留出波动余量
        run: uv run --locked --extra dev pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Build wheel (packaging check)
        run: |
          uv build --wheel --out-dir dist/
          python - <<'EOF'
          import glob, zipfile

          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as archive:
              names = archive.namelist()
              metadata_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
              entry_name = next(n for n in names if n.endswith(".dist-info/entry_points.txt"))
              metadata = archive.read(metadata_name).decode()
              entries = archive.read(entry_name).decode()
          assert "app/prompts/vision_parser.txt" in names
          assert "app/data/external-trial-evidence.json" in names
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names)
          assert "Version: 0.2.0b1" in metadata
          assert "Requires-Python: >=3.11" in metadata
          assert "License-Expression: MIT" in metadata
          assert "crochet2pattern = app.cli:main" in entries
          assert "crochet2pattern-eval = app.evaluation:main" in entries
          assert "crochet2pattern-trials = app.trials:main" in entries
          print("wheel metadata, license, CLI, prompt and curated evidence: OK")
          EOF
