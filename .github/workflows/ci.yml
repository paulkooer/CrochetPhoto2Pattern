name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 构建但不推送；load 进本地 daemon 后实际运行容器做冒烟，防止 Dockerfile /
      # 依赖图腐化只在部署时才暴露（此前只构建不运行，审核 F-18）。
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: crochet-photo2pattern:ci
          cache-from: type=gha
          cache-to: type=gha,mode=minimal

      - name: Container smoke (health, non-root, production flags)
        run: |
          docker run -d --name app -p 8501:8501 crochet-photo2pattern:ci
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          curl -fsS http://127.0.0.1:8501/ | grep -qi "<html"
          # 非 root 运行；生产镜像不向浏览器暴露异常堆栈（F-16）
          test "$(docker exec app id -u)" = "1000"
          docker inspect --format '{{json .Config.Cmd}}' app | grep -q -- '--client.showErrorDetails=none'
          # 上传解码依赖须为已修复版本（F-02）
          docker exec app python -c "import PIL; assert int(PIL.__version__.split('.')[0]) >= 13, PIL.__version__; print('pillow', PIL.__version__)"
          # /_stcore/health 在脚本运行前就会返回 ok，探不到运行期缺库；这里导入应用
          # 模块并真正调用应用依赖的 OpenCV 算子（运行阶段未装任何 apt 包，缺系统库
          # 即在此失败）。
          docker exec app python -c "import app.models.orchestrator, app.ui.result_renderer"
          docker exec -i app python - <<'EOF'
          import cv2
          import numpy as np

          img = np.zeros((64, 64, 3), np.uint8)
          img[16:48, 16:48] = 200
          mask = np.zeros(img.shape[:2], np.uint8)
          bgd, fgd = np.zeros((1, 65), np.float64), np.zeros((1, 65), np.float64)
          cv2.grabCut(img, mask, (8, 8, 48, 48), bgd, fgd, 1, cv2.GC_INIT_WITH_RECT)
          cascade = cv2.CascadeClassifier(cv2.data.haarcascades + "haarcascade_frontalface_default.xml")
          assert not cascade.empty()
          assert cv2.cvtColor(img, cv2.COLOR_RGB2LAB).shape == (64, 64, 3)
          print("cv2", cv2.__version__, "grabCut/Haar/cvtColor OK")
          EOF

      - name: Container logs on failure
        if: failure()
        run: docker logs app || true

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      # 当前基线：app 全包 0 错误（37 文件）；配置见 pyproject [tool.mypy]
      - name: Type check (mypy)
        run: uv run --locked --extra dev mypy app tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # .python-version 只服务本地默认值；远程矩阵必须显式覆盖，否则 uv 会让
    # 四个 job 都静默使用 3.12，形成“假矩阵”。
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # setup-uv 负责 UV_PYTHON 指定解释器的安装与 uv 自身的缓存：
      # 旧组合 setup-python(cache: pip) + pip install uv 的 pip 缓存对
      # uv 装出来的 .venv 完全无效（白缓存）。
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --extra dev ruff check app tests

      - name: Test
        # 阈值放在 CI 命令而非 pytest addopts，保证本地裸 pytest 不依赖 pytest-cov
        # 当前实测 ~90%，阈值 80% 留出波动余量
        run: uv run --locked --extra dev pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Build wheel (packaging check)
        run: |
          uv build --wheel --out-dir dist/
          python3 - <<'EOF'
          import glob, zipfile

          whl = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(whl) as archive:
              names = archive.namelist()
              metadata_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
              entry_name = next(n for n in names if n.endswith(".dist-info/entry_points.txt"))
              metadata = archive.read(metadata_name).decode()
              entries = archive.read(entry_name).decode()
          assert "app/py.typed" in names
          assert "app/ui/mask_canvas/index.html" in names
          assert "app/ui/mask_canvas/editor.js" in names
          assert not any(n.startswith("app/prompts/") for n in names)
          assert "Requires-Dist: openai" not in metadata
          assert "Requires-Dist: anthropic" not in metadata
          assert "app/data/external-trial-evidence.json" in names
          assert any(n.endswith(".dist-info/licenses/LICENSE") for n in names)
          assert "Version: 0.2.0b2" in metadata
          assert "Requires-Python: >=3.11" in metadata
          assert "License-Expression: MIT" in metadata
          assert "crochet2pattern = app.cli:main" in entries
          assert "crochet2pattern-eval = app.evaluation:main" in entries
          assert "crochet2pattern-trials = app.trials:main" in entries
          print("wheel metadata, license, CLI and curated evidence: OK")
          EOF
